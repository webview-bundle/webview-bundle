include = ["**/Cargo.toml", "**/uniffi*.toml", ".cargo/*.toml"]
exclude = [
  "node_modules/**/*",
  "**/dist/**",
  "**/dist-*/**",
  "target/**",
  ".yarn/**/*",
  "packages/tauri/permissions/autogenerated/**/*",
  "playground/**/*"
]

[formatting]
align_entries = true
column_width  = 120
reorder_keys  = true
