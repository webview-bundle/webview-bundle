approvedGitRepositories:
  - "**"

catalog:
  "@types/node": 25.9.1
  tsdown: 0.22.1
  typescript: 6.0.3
  vitest: 4.1.8

enableGlobalCache: true

enableScripts: true

nodeLinker: node-modules

npmAuditRegistry: "https://registry.npmjs.org"

npmMinimalAgeGate: 0

preferReuse: true

supportedArchitectures:
  cpu:
    - x64
    - ia32
    - arm64
  libc:
    - glibc
    - musl
  os:
    - darwin
    - linux
    - win32

yarnPath: .yarn/releases/yarn-4.15.0.cjs
