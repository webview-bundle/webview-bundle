[package]
description = "Deno FFI binding for webview bundle"
edition     = { workspace = true }
license     = { workspace = true }
name        = "wvb-deno"
publish     = false
repository  = { workspace = true }
version     = "0.0.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
serde_json = { workspace = true }
tokio      = { workspace = true, features = ["rt", "rt-multi-thread", "macros"] }
wvb        = { workspace = true, features = ["protocol", "protocol-local", "remote", "updater", "integrity"] }
