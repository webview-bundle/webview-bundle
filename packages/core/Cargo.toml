[package]
authors      = { workspace = true }
description  = "Offline-first web resources delivery system for webview mounted frameworks/platforms"
edition      = { workspace = true }
license      = { workspace = true }
name         = "wvb"
repository   = { workspace = true }
rust-version = "1.87.0"
version      = "0.2.0"

[lib]
bench = false

[dependencies]
anyhow           = { workspace = true, optional = true }
async-trait      = { workspace = true }
base64ct         = { workspace = true, optional = true }
bincode          = { workspace = true }
bytes            = { workspace = true, optional = true }
dashmap          = { workspace = true, optional = true }
ed25519-dalek    = { workspace = true, optional = true }
futures-util     = { workspace = true, optional = true }
getrandom        = { workspace = true, optional = true }
http             = { workspace = true }
http-range       = { workspace = true, optional = true }
httpmock         = { workspace = true, optional = true }
lz4_flex         = { workspace = true }
p256             = { workspace = true, optional = true }
p384             = { workspace = true, optional = true }
percent-encoding = { workspace = true, optional = true }
reqwest          = { workspace = true, default-features = false, optional = true }
rsa              = { workspace = true, optional = true }
semver           = { workspace = true, optional = true }
serde            = { workspace = true, optional = true }
serde_json       = { workspace = true, optional = true }
serde_repr       = { workspace = true, optional = true }
sha2             = { workspace = true, optional = true }
thiserror        = { workspace = true }
time             = { workspace = true, features = ["formatting", "local-offset", "large-dates"], optional = true }
tokio            = { workspace = true, optional = true }
tokio-util       = { workspace = true, optional = true }
tracing          = { workspace = true, optional = true }
twox-hash        = { workspace = true, features = ["serialize"] }
urlencoding      = { workspace = true, optional = true }

[dev-dependencies]
serde      = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tiny_http  = { workspace = true }
tokio      = { workspace = true, features = ["full"] }

[features]
_reqwest = ["dep:reqwest"]
_serde = ["dep:serde", "dep:serde_json", "dep:serde_repr"]
async = [
  "dep:tokio",
  "tokio/io-util",
  "tokio/rt",
  "tokio/rt-multi-thread",
  "tokio/fs",
  "tokio/sync",
  "tokio/time",
  "dep:tokio-util",
]
full = [
  "serde",
  "async",
  "source",
  "protocol",
  "protocol-proxy",
  "updater",
  "remote",
  "integrity",
  "signature",
  "signature-rsa-pkcs1-v1_5-sha256",
  "signature-rsa-pss-sha256",
  "signature-ecdsa-secp256r1",
  "signature-ecdsa-secp384r1",
  "signature-ed25519",
  "tracing",
  "testing",
]
integrity = ["_serde", "sha2", "base64ct", "base64ct/alloc"]
protocol = ["source", "dep:bytes", "dep:percent-encoding", "dep:http-range", "dep:getrandom"]
protocol-proxy = ["protocol", "_reqwest", "reqwest/rustls", "reqwest/charset"]
remote = [
  "async",
  "_reqwest",
  "_serde",
  "reqwest/rustls",
  "reqwest/json",
  "reqwest/stream",
  "tokio/macros",
  "dep:urlencoding",
  "dep:futures-util",
]
serde = ["_serde"]
signature = ["integrity"]
signature-ecdsa-secp256r1 = ["dep:p256"]
signature-ecdsa-secp384r1 = ["dep:p384"]
signature-ed25519 = ["dep:ed25519-dalek", "ed25519-dalek/pem"]
signature-rsa-pkcs1-v1_5-sha256 = ["dep:rsa", "rsa/sha2"]
signature-rsa-pss-sha256 = ["dep:rsa", "rsa/sha2", "rsa/getrandom"]
source = ["dep:dashmap", "async", "_serde", "dep:semver", "tokio/macros"]
testing = ["source", "remote", "integrity", "dep:httpmock", "dep:time", "dep:anyhow"]
tracing = ["dep:tracing"]
updater = ["remote", "source", "dep:time", "time/parsing"]

[lints.clippy]
module_inception = "allow"
