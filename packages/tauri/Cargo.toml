[package]
authors      = { workspace = true }
description  = "Webview bundle API for Tauri"
edition      = { workspace = true }
license      = { workspace = true }
links        = "wvb-tauri"
name         = "wvb-tauri"
repository   = { workspace = true }
rust-version = "1.85.0"
version      = "0.1.0"

[dependencies]
serde     = { workspace = true }
tauri     = { workspace = true, features = ["unstable"] }
thiserror = { workspace = true }
wvb       = { workspace = true, features = [
  "source",
  "protocol",
  "protocol-local",
  "remote",
  "updater",
  "integrity",
  "signature",
  "signature-ecdsa_secp256r1",
  "signature-ecdsa_secp384r1",
  "signature-edd25519",
  "signature-rsa_pkcs1_v1_5",
  "signature-rsa_pss",
] }

[build-dependencies]
tauri-plugin = { workspace = true, features = ["build"] }

[dev-dependencies]
tauri = { workspace = true, features = ["test"] }
tokio = { workspace = true, features = ["full"] }

# Resolver-only pins (never compiled): tauri pulls brotli 8.0.3, which caps alloc-no-stdlib at 2.x.
# But two of brotli's deps shipped releases that jumped to the incompatible alloc-no-stdlib 3.0.0
[target.'cfg(any())'.dependencies]
alloc-stdlib        = "=0.2.2"
brotli-decompressor = "=5.0.1"
