[package]
authors      = { workspace = true }
description  = "Webview bundle API for Tauri"
edition      = { workspace = true }
license      = { workspace = true }
links        = "wvb-tauri"
name         = "wvb-tauri"
repository   = { workspace = true }
rust-version = "1.85.0"
version      = "0.1.0"

[dependencies]
serde     = { workspace = true }
tauri     = { workspace = true, features = ["unstable"] }
thiserror = { workspace = true }
tracing   = { workspace = true }
wvb       = { workspace = true, features = ["source", "protocol", "protocol-local", "remote", "updater"] }

[build-dependencies]
tauri-plugin = { workspace = true, features = ["build"] }

# Android ships builtin bundles as APK `asset://` resources that std::fs cannot
# read, so they are extracted via the fs plugin (see src/android.rs).
[target.'cfg(target_os = "android")'.dependencies]
serde_json      = { workspace = true }
tauri-plugin-fs = "2"

# Resolver-only pins (never compiled): tauri pulls brotli 8.0.3, which caps alloc-no-stdlib at 2.x.
# But two of brotli's deps shipped releases that jumped to the incompatible alloc-no-stdlib 3.0.0
[target.'cfg(any())'.dependencies]
alloc-stdlib        = "=0.2.2"
brotli-decompressor = "=5.0.1"
