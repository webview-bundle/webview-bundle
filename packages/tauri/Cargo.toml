[package]
authors      = { workspace = true }
description  = "Webview bundle API for Tauri"
edition      = { workspace = true }
license      = { workspace = true }
links        = "wvb-tauri"
name         = "wvb-tauri"
repository   = { workspace = true }
rust-version = "1.85.0"
version      = "0.1.0"

[dependencies]
serde     = { workspace = true }
tauri     = { workspace = true, features = ["unstable"] }
thiserror = { workspace = true }
wvb       = { workspace = true, features = ["source", "protocol", "protocol-local", "remote", "updater"] }

[build-dependencies]
tauri-plugin = { workspace = true, features = ["build"] }

# Resolver-only pin (never compiled): brotli 8.0.3 (pulled via tauri) needs alloc-no-stdlib 2.x,
# but alloc-stdlib 0.2.3 widened its requirement to allow the incompatible alloc-no-stdlib 3.0.0,
[target.'cfg(any())'.dependencies]
alloc-no-stdlib = "=2.0.4"
