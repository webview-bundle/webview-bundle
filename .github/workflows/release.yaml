name: release
on:
  push:
    branches:
      - "main"
  workflow_dispatch:
    inputs:
      id:
        description: "Prerelease channel id (e.g. \"next\")"
        required: false
        default: "next"
permissions:
  attestations: write
  contents: write
  id-token: write
concurrency:
  group: release-${{ github.event_name }}-${{ github.ref_name }}
env:
  LEFTHOOK: 0
jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      release_commit: ${{ steps.detect.outputs.release_commit }}
    steps:
      - name: Git checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # 6.0.1
        with:
          fetch-depth: '0'
          fetch-tags: 'true'
      - name: Setup Node.js
        uses: ./.github/actions/node-setup
      - run: yarn install --immutable
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # 4.0.0
      - name: Detect release commit
        id: detect
        run: just xtask release --check

  build-napi:
    name: build-napi (${{ matrix.settings.host }}, ${{ matrix.settings.target }})
    needs: [detect]
    # Build only when something will consume it: a release commit, or a manual prerelease.
    if: github.event_name == 'workflow_dispatch' || needs.detect.outputs.release_commit == 'true'
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: macos-15-intel
            target: x86_64-apple-darwin
            build: yarn workspaces foreach -At --include='@wvb/*' run build-napi --target x86_64-apple-darwin
          - host: macos-latest
            target: aarch64-apple-darwin
            build: yarn workspaces foreach -At --include='@wvb/*' run build-napi --target aarch64-apple-darwin
          - host: windows-latest
            build: yarn workspaces foreach -At --include='@wvb/*' run build-napi --target i686-pc-windows-msvc
            target: i686-pc-windows-msvc
          - host: windows-latest
            build: yarn workspaces foreach -At --include='@wvb/*' run build-napi --target x86_64-pc-windows-msvc
            target: x86_64-pc-windows-msvc
          - host: windows-latest
            target: aarch64-pc-windows-msvc
            build: yarn workspaces foreach -At --include='@wvb/*' run build-napi --target aarch64-pc-windows-msvc
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            build: yarn workspaces foreach -At --include='@wvb/*' run build-napi --target x86_64-unknown-linux-gnu --use-napi-cross
          - host: ubuntu-latest
            target: x86_64-unknown-linux-musl
            build: yarn workspaces foreach -At --include='@wvb/*' run build-napi --target x86_64-unknown-linux-musl -x
          - host: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            build: yarn workspaces foreach -At --include='@wvb/*' run build-napi --target aarch64-unknown-linux-gnu --use-napi-cross
          - host: ubuntu-latest
            target: aarch64-unknown-linux-musl
            build: yarn workspaces foreach -At --include='@wvb/*' run build-napi --target aarch64-unknown-linux-musl -x
          - host: ubuntu-latest
            target: armv7-unknown-linux-gnueabihf
            build: yarn workspaces foreach -At --include='@wvb/*' run build-napi --target armv7-unknown-linux-gnueabihf --use-napi-cross
          - host: ubuntu-latest
            target: aarch64-linux-android
            build: yarn workspaces foreach -At --include='@wvb/*' run build-napi --target aarch64-linux-android
          - host: ubuntu-latest
            target: armv7-linux-androideabi
            build: yarn workspaces foreach -At --include='@wvb/*' run build-napi --target armv7-linux-androideabi
    runs-on: ${{ matrix.settings.host }}
    env:
      DEBUG: 'napi:*'
      MACOSX_DEPLOYMENT_TARGET: '10.13'
      CARGO_INCREMENTAL: '1'
      # Fix for ring crate cross-compilation on aarch64
      # See: https://github.com/briansmith/ring/issues/1789
      CFLAGS_aarch64_unknown_linux_gnu: ${{ matrix.settings.target == 'aarch64-unknown-linux-gnu' && '-D__ARM_ARCH=8' || '' }}
    steps:
      - name: Git checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # 6.0.1
      - name: Setup Node.js
        uses: ./.github/actions/node-setup
      - name: Setup Rust
        uses: ./.github/actions/rust-setup
        with:
          targets: ${{ matrix.settings.target }}
          cache-key: ${{ matrix.settings.target }}-cargo-${{ matrix.settings.host }}
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # 2.2.1
        if: ${{ contains(matrix.settings.target, 'musl') }}
        with:
          version: 0.14.1
      - name: Install cargo-zigbuild
        uses: taiki-e/install-action@288875dd3d64326724fa6d9593062d9f8ba0b131 # 2.67.30
        if: ${{ contains(matrix.settings.target, 'musl') }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          tool: cargo-zigbuild
      - run: yarn install --immutable
      - name: Run build
        run: ${{ matrix.settings.build }}
        shell: bash
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # 4.0.0
      - name: Merge artifacts
        run: just xtask artifacts merge
      - name: Upload artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # 6.0.0
        with:
          name: artifacts-${{ github.ref_name }}-${{ matrix.settings.host }}-${{ matrix.settings.target }}
          path: artifacts-merged
          if-no-files-found: error

  build-ffi-android:
    runs-on: ubuntu-latest
    name: build-ffi-android
    needs: [detect]
    if: github.event_name == 'workflow_dispatch' || needs.detect.outputs.release_commit == 'true'
    steps:
      - name: Git checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # 6.0.1
      - name: Setup Rust
        uses: ./.github/actions/rust-setup
      - name: Setup Node.js
        uses: ./.github/actions/node-setup
      - run: yarn install --immutable
      - name: Use JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5
        with:
          distribution: 'temurin' # See 'Supported distributions' for available options
          java-version: '21'
      - name: Install android sdk
        uses: malinskiy/action-android/install-sdk@fa103ef30331e95f266418a6a97e98f61f626887 # release/0.1.7
      - name: Install android ndk
        uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1
        id: install-ndk
        with:
          ndk-version: r27
      - name: Install Rust dependencies
        run: |
          rustup target add x86_64-linux-android \
            aarch64-linux-android \
            armv7-linux-androideabi \
            i686-linux-android
          cargo install cargo-ndk
      - name: Build ffi android
        run: yarn workspaces foreach -At --include='@wvb/*' run build-ffi-android
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # 4.0.0
      - name: Merge artifacts
        run: just xtask artifacts merge
      - name: Upload artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # 6.0.0
        with:
          name: artifacts-${{ github.ref_name }}-ffi-android
          path: artifacts-merged
          if-no-files-found: error

  build-ffi-apple:
    runs-on: macos-latest
    needs: [detect]
    if: github.event_name == 'workflow_dispatch' || needs.detect.outputs.release_commit == 'true'
    steps:
      - name: Git checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # 6.0.1
      - name: Setup Rust
        uses: ./.github/actions/rust-setup
      - name: Setup Node.js
        uses: ./.github/actions/node-setup
      - run: yarn install --immutable
      - name: Install Rust dependencies
        run: |
          rustup target add aarch64-apple-ios \
            aarch64-apple-ios \
            aarch64-apple-ios-sim \
            x86_64-apple-ios \
            x86_64-apple-darwin
      - name: Install tuist
        uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # 4.0.1
        with:
          install_args: "tuist"
      - name: Build ffi apple
        run: yarn workspaces foreach -At --include='@wvb/*' run build-ffi-apple
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # 4.0.0
      - name: Merge artifacts
        run: just xtask artifacts merge
      - name: Upload artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # 6.0.0
        with:
          name: artifacts-${{ github.ref_name }}-ffi-apple
          path: artifacts-merged
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    needs: [detect, build-napi, build-ffi-android, build-ffi-apple]
    if: github.event_name == 'push' && needs.detect.outputs.release_commit == 'true'
    steps:
      - name: Git checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # 6.0.1
        with:
          fetch-depth: '0'
          fetch-tags: 'true'
      - name: Setup tauri for linux
        uses: ./.github/actions/tauri-linux-setup
      - name: Setup Node.js
        uses: ./.github/actions/node-setup
      - run: yarn install --immutable
      - name: Setup Rust
        uses: ./.github/actions/rust-setup
      - name: Download artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # 7.0.0
        with:
          pattern: artifacts-${{ github.ref_name }}-*
          merge-multiple: true
          path: artifacts-merged
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # 4.0.0
      - name: Spread artifacts
        run: just xtask artifacts spread
      - name: Release
        run: just xtask release --github-token=${{ github.token }}
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  prerelease:
    runs-on: ubuntu-latest
    needs: [detect, build-napi, build-ffi-android, build-ffi-apple]
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Git checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # 6.0.1
        with:
          fetch-depth: '0'
          fetch-tags: 'true'
      - name: Setup tauri for linux
        uses: ./.github/actions/tauri-linux-setup
      - name: Setup Node.js
        uses: ./.github/actions/node-setup
      - run: yarn install --immutable
      - name: Setup Rust
        uses: ./.github/actions/rust-setup
      - name: Download artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # 7.0.0
        with:
          pattern: artifacts-${{ github.ref_name }}-*
          merge-multiple: true
          path: artifacts-merged
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # 4.0.0
      - name: Spread artifacts
        run: just xtask artifacts spread
      - name: Prerelease
        run: just xtask prerelease --id=${{ inputs.id }} --github-token=${{ github.token }}
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
