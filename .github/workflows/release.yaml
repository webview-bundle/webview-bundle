name: release
on:
  push:
    branches:
      - "main"
  workflow_dispatch:
    inputs:
      id:
        description: "Prerelease channel id (e.g. \"next\")"
        required: false
        default: "next"
permissions:
  attestations: write
  contents: write
  id-token: write
concurrency:
  group: release-${{ github.event_name }}-${{ github.ref_name }}
env:
  LEFTHOOK: 0
jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      release_commit: ${{ steps.detect.outputs.release_commit }}
      release_packages: ${{ steps.detect.outputs.release_packages }}
    steps:
      - name: Git checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # 6.0.1
        with:
          fetch-depth: '0'
          fetch-tags: 'true'
      - name: Setup Node.js
        uses: ./.github/actions/node-setup
      - run: yarn install --immutable
      - name: Detect release commit
        id: detect
        run: node ./xtask/cli.ts release --check

  build-napi:
    name: build-napi (${{ matrix.settings.host }}, ${{ matrix.settings.target }})
    needs: [detect]
    # Build only when something will consume it: a release commit, or a manual prerelease.
    if: github.event_name == 'workflow_dispatch' || needs.detect.outputs.release_commit == 'true'
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: macos-15-intel
            target: x86_64-apple-darwin
            build: yarn workspaces foreach -At --include='@wvb/*' run build-napi --target x86_64-apple-darwin
          - host: macos-latest
            target: aarch64-apple-darwin
            build: yarn workspaces foreach -At --include='@wvb/*' run build-napi --target aarch64-apple-darwin
          - host: windows-latest
            build: yarn workspaces foreach -At --include='@wvb/*' run build-napi --target i686-pc-windows-msvc
            target: i686-pc-windows-msvc
          - host: windows-latest
            build: yarn workspaces foreach -At --include='@wvb/*' run build-napi --target x86_64-pc-windows-msvc
            target: x86_64-pc-windows-msvc
          - host: windows-latest
            target: aarch64-pc-windows-msvc
            build: yarn workspaces foreach -At --include='@wvb/*' run build-napi --target aarch64-pc-windows-msvc
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            build: yarn workspaces foreach -At --include='@wvb/*' run build-napi --target x86_64-unknown-linux-gnu --use-napi-cross
          - host: ubuntu-latest
            target: x86_64-unknown-linux-musl
            build: yarn workspaces foreach -At --include='@wvb/*' run build-napi --target x86_64-unknown-linux-musl -x
          - host: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            build: yarn workspaces foreach -At --include='@wvb/*' run build-napi --target aarch64-unknown-linux-gnu --use-napi-cross
          - host: ubuntu-latest
            target: aarch64-unknown-linux-musl
            build: yarn workspaces foreach -At --include='@wvb/*' run build-napi --target aarch64-unknown-linux-musl -x
          - host: ubuntu-latest
            target: armv7-unknown-linux-gnueabihf
            build: yarn workspaces foreach -At --include='@wvb/*' run build-napi --target armv7-unknown-linux-gnueabihf --use-napi-cross
          - host: ubuntu-latest
            target: aarch64-linux-android
            build: yarn workspaces foreach -At --include='@wvb/*' run build-napi --target aarch64-linux-android
          - host: ubuntu-latest
            target: armv7-linux-androideabi
            build: yarn workspaces foreach -At --include='@wvb/*' run build-napi --target armv7-linux-androideabi
    runs-on: ${{ matrix.settings.host }}
    env:
      DEBUG: 'napi:*'
      MACOSX_DEPLOYMENT_TARGET: '10.13'
      CARGO_INCREMENTAL: '1'
      # Fix for ring crate cross-compilation on aarch64
      # See: https://github.com/briansmith/ring/issues/1789
      CFLAGS_aarch64_unknown_linux_gnu: ${{ matrix.settings.target == 'aarch64-unknown-linux-gnu' && '-D__ARM_ARCH=8' || '' }}
    steps:
      - name: Git checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # 6.0.1
      - name: Setup Node.js
        uses: ./.github/actions/node-setup
      - name: Setup Rust
        uses: ./.github/actions/rust-setup
        with:
          targets: ${{ matrix.settings.target }}
          cache-key: ${{ matrix.settings.target }}-cargo-${{ matrix.settings.host }}
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # 2.2.1
        if: ${{ contains(matrix.settings.target, 'musl') }}
        with:
          version: 0.14.1
      - name: Install cargo-zigbuild
        uses: taiki-e/install-action@288875dd3d64326724fa6d9593062d9f8ba0b131 # 2.67.30
        if: ${{ contains(matrix.settings.target, 'musl') }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          tool: cargo-zigbuild
      - run: yarn install --immutable
      - name: Run build
        run: ${{ matrix.settings.build }}
        shell: bash
      - name: Merge artifacts
        run: node ./xtask/cli.ts artifacts merge
        shell: bash
      - name: Upload artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # 6.0.0
        with:
          name: artifacts-${{ github.ref_name }}-${{ matrix.settings.host }}-${{ matrix.settings.target }}
          path: artifacts-merged
          if-no-files-found: error
          overwrite: true

  build-ffi-android:
    runs-on: ubuntu-latest
    name: build-ffi-android
    needs: [detect]
    # Prereleases (workflow_dispatch) release every package, so always build. Stable releases build
    # ffi only when the `ffi` package is among this commit's release targets.
    if: github.event_name == 'workflow_dispatch' || contains(fromJSON(needs.detect.outputs.release_packages || '[]'), 'ffi')
    steps:
      - name: Git checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # 6.0.1
      - name: Setup Rust
        uses: ./.github/actions/rust-setup
      - name: Setup Node.js
        uses: ./.github/actions/node-setup
      - run: yarn install --immutable
      - name: Use JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5
        with:
          distribution: 'temurin' # See 'Supported distributions' for available options
          java-version: '21'
      - name: Install android sdk
        uses: malinskiy/action-android/install-sdk@fa103ef30331e95f266418a6a97e98f61f626887 # release/0.1.7
      - name: Install android ndk
        uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1
        id: install-ndk
        with:
          # # Android 15+ 16 KB page support
          ndk-version: r28
      - name: Install Rust dependencies
        run: |
          rustup target add x86_64-linux-android \
            aarch64-linux-android \
            armv7-linux-androideabi \
            i686-linux-android
          cargo install cargo-ndk
      - name: Build ffi android
        run: yarn workspace wvb-ffi run build-ffi-android
      - name: Merge artifacts
        run: node ./xtask/cli.ts artifacts merge
        shell: bash
      - name: Upload artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # 6.0.0
        with:
          name: artifacts-${{ github.ref_name }}-ffi-android
          path: artifacts-merged
          if-no-files-found: error
          overwrite: true

  build-ffi-apple:
    runs-on: macos-latest
    needs: [detect]
    # Prereleases (workflow_dispatch) release every package, so always build. Stable releases build
    # ffi only when the `ffi` package is among this commit's release targets.
    if: github.event_name == 'workflow_dispatch' || contains(fromJSON(needs.detect.outputs.release_packages || '[]'), 'ffi')
    steps:
      - name: Git checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # 6.0.1
      - name: Setup Rust
        uses: ./.github/actions/rust-setup
      - name: Setup Node.js
        uses: ./.github/actions/node-setup
      - run: yarn install --immutable
      - name: Install Rust dependencies
        run: |
          rustup target add aarch64-apple-ios \
            aarch64-apple-ios \
            aarch64-apple-ios-sim \
            x86_64-apple-ios \
            x86_64-apple-darwin
      - name: Install tuist
        uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # 4.0.1
        with:
          install_args: "tuist"
      - name: Build ffi apple
        run: yarn workspace wvb-ffi run build-ffi-apple
      - name: Merge artifacts
        run: node ./xtask/cli.ts artifacts merge
        shell: bash
      - name: Upload artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # 6.0.0
        with:
          name: artifacts-${{ github.ref_name }}-ffi-apple
          path: artifacts-merged
          if-no-files-found: error
          overwrite: true

  build-deno:
    name: build-deno (${{ matrix.settings.target }})
    runs-on: ${{ matrix.settings.host }}
    needs: [detect]
    if: github.event_name == 'workflow_dispatch' || contains(fromJSON(needs.detect.outputs.release_packages || '[]'), 'deno')
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: macos-latest
            target: aarch64-apple-darwin
          - host: macos-15-intel
            target: x86_64-apple-darwin
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - host: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            zigbuild: true
          - host: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - name: Git checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # 6.0.1
      - name: Setup Node.js
        uses: ./.github/actions/node-setup
      - name: Setup Rust
        uses: ./.github/actions/rust-setup
        with:
          targets: ${{ matrix.settings.target }}
          cache-key: deno-${{ matrix.settings.target }}-${{ matrix.settings.host }}
      - name: Setup Deno
        uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # 4.0.1
        with:
          install_args: "deno"
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # 2.2.1
        if: ${{ matrix.settings.zigbuild }}
        with:
          version: 0.14.1
      - name: Install cargo-zigbuild
        uses: taiki-e/install-action@288875dd3d64326724fa6d9593062d9f8ba0b131 # 2.67.30
        if: ${{ matrix.settings.zigbuild }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          tool: cargo-zigbuild
      - run: yarn install --immutable
      - name: Build deno cdylib
        run: deno run --allow-read --allow-write --allow-run --allow-env ./deno/scripts/build.ts --target ${{ matrix.settings.target }} ${{ matrix.settings.zigbuild && '--zigbuild' || '' }}
        working-directory: packages
        shell: bash
      - name: Merge artifacts
        run: node ./xtask/cli.ts artifacts merge
        shell: bash
      - name: Upload artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # 6.0.0
        with:
          name: artifacts-${{ github.ref_name }}-deno-${{ matrix.settings.target }}
          path: artifacts-merged
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    needs: [detect, build-napi, build-ffi-android, build-ffi-apple, build-deno]
    if: >-
      !cancelled() &&
      github.event_name == 'push' &&
      needs.detect.result == 'success' &&
      needs.detect.outputs.release_commit == 'true' &&
      needs.build-napi.result == 'success' &&
      (needs.build-ffi-android.result == 'success' || needs.build-ffi-android.result == 'skipped') &&
      (needs.build-ffi-apple.result == 'success' || needs.build-ffi-apple.result == 'skipped') &&
      (needs.build-deno.result == 'success' || needs.build-deno.result == 'skipped')
    steps:
      - name: Git checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # 6.0.1
        with:
          fetch-depth: '0'
          fetch-tags: 'true'
      - name: Setup tauri for linux
        uses: ./.github/actions/tauri-linux-setup
      - name: Setup Node.js
        uses: ./.github/actions/node-setup
      - run: yarn install --immutable
      - name: Setup Rust
        uses: ./.github/actions/rust-setup
      - name: Setup Deno
        uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # 4.0.1
        with:
          install_args: "deno"
      - name: Download artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # 7.0.0
        with:
          pattern: artifacts-${{ github.ref_name }}-*
          merge-multiple: true
          path: artifacts-merged
      - name: Spread artifacts
        run: node ./xtask/cli.ts artifacts spread
        shell: bash
      - name: Release
        run: node ./xtask/cli.ts release --github-token=${{ github.token }}
        shell: bash
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  prerelease:
    runs-on: ubuntu-latest
    needs: [detect, build-napi, build-ffi-android, build-ffi-apple, build-deno]
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Git checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # 6.0.1
        with:
          fetch-depth: '0'
          fetch-tags: 'true'
      - name: Setup tauri for linux
        uses: ./.github/actions/tauri-linux-setup
      - name: Setup Node.js
        uses: ./.github/actions/node-setup
      - run: yarn install --immutable
      - name: Setup Rust
        uses: ./.github/actions/rust-setup
      - name: Setup Deno
        uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # 4.0.1
        with:
          install_args: "deno"
      - name: Download artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # 7.0.0
        with:
          pattern: artifacts-${{ github.ref_name }}-*
          merge-multiple: true
          path: artifacts-merged
      - name: Spread artifacts
        run: node ./xtask/cli.ts artifacts spread
        shell: bash
      - name: Prerelease
        run: node ./xtask/cli.ts prerelease --id=${{ inputs.id }} --github-token=${{ github.token }}
        shell: bash
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
