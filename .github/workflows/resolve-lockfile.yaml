name: resolve-lockfile
# Auto-resolve a PR whose only merge conflict with its base branch is `yarn.lock`.
# Trigger: a maintainer comments `/merge-lockfile` (or `/resolve-lockfile`) on the PR.
on:
  issue_comment:
    types: [created]
permissions:
  contents: write
  pull-requests: write
  # The 👀 acknowledgement and the resolver's outcome reactions hit the issue-comment reactions
  # endpoint, which the Issues scope gates even for PR comments.
  issues: write
  # The resolver reads the PR head's check-runs + commit-status rollup to confirm only the lockfile
  # conflict is blocking the merge before it acts.
  checks: read
  statuses: read
concurrency:
  group: resolve-lockfile-${{ github.event.issue.number }}
  cancel-in-progress: false
env:
  LEFTHOOK: 0
jobs:
  resolve:
    if: >-
      github.event.issue.pull_request &&
      (startsWith(github.event.comment.body, '/merge-lockfile') ||
       startsWith(github.event.comment.body, '/resolve-lockfile')) &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    steps:
      - name: Acknowledge command
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST \
            -H "Accept: application/vnd.github+json" \
            "/repos/${{ github.repository }}/issues/comments/${{ github.event.comment.id }}/reactions" \
            -f content=eyes
      - name: Git checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # 6.0.1
        with:
          fetch-depth: 0
          token: ${{ github.token }}
      - name: Setup Node.js
        uses: ./.github/actions/node-setup
      - run: yarn workspaces focus xtask
      - name: Resolve yarn.lock conflict
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COMMENT_ID: ${{ github.event.comment.id }}
          COMMENT_USER: ${{ github.event.comment.user.login }}
        run: node ./xtask/cli.ts resolve-lockfile --pr "${{ github.event.issue.number }}"
