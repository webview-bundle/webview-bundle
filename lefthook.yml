pre-commit:
  parallel: true
  commands:
    rustfmt:
      glob: '*.rs'
      run: cargo fmt --all
      stage_fixed: true
    clippy:
      glob: '*.rs'
      run: cargo clippy --workspace
    biome:
      glob: '*.{js,ts,jsx,tsx,cjs,mjs,cts,mts,json}'
      run: yarn biome check --write --no-errors-on-unmatched --files-ignore-unknown=true --colors=off {staged_files}
      stage_fixed: true
    taplo:
      glob:
        - '**/Cargo.toml'
        - '**/uniffi*.toml'
        - '.cargo/*.toml'
      run: yarn taplo format {staged_files}
      stage_fixed: true
pre-push:
  commands:
    constraints:
      run: yarn constraints
